loop: forecast
agent: forecast
job: Make an independent forecast call by segment with reasons.
trigger: weekly, after the forecast snapshot
starting_level: 0
max_level: 3
skills:
- evidence
- forecast-method
tools:
- search_evidence
- record_evidence
- escalate
writes: an independent forecast call by segment, recorded as inferred evidence on the territory
promotion_metric: error vs actuals, compared with the human call
input_example: '{"snapshot_week": "2026-11-02"}'
prompt: prompt.md
prompt_version: v2
technical_notes: "Record each segment's call as evidence of kind \"inferred\" on the segment's territory. Start each claim with the numbers in this wording, so the forecast_calls view can read them: \"Agent forecast call: $1.42M this quarter (range $1.25M to $1.56M). Human call: $1.38M.\" This loop starts at level 0."
