loop: operating_design
agent: operating-design
job: Propose changes to stages, methodology and the human-agent split.
trigger: quarterly
starting_level: 1
max_level: 2
skills:
- evidence
- operating-design
- stages
tools:
- search_evidence
- record_evidence
- propose_decision
- propose_skill_version
- escalate
writes: proposed skill versions and process changes
promotion_metric: proposals adopted, and conversion change after adoption
input_example: '{"quarter": "2026-Q4"}'
prompt: prompt.md
prompt_version: v2
technical_notes: "Skill changes: a decision with action \"propose_skill_version\" (subject_type \"skill\", subject_id the skill name), then propose_skill_version with the full text. Other changes: one decision each. This loop is capped at level 2."
